project:
  description: M2354 PSA ECC sign and verify sample using Mbed TLS 4.x
  packs:
    - pack: Nuvoton::NuMicroM23_DFP
  layers:
    - layer: ../../mbedtls4_psa_common.clayer.yml
  misc:
    - for-compiler: AC6
      C: [-std=c99, -fno-rtti, -funsigned-char, -fshort-enums, -fshort-wchar, -ffunction-sections, -fdata-sections, -D__MICROLIB, -gdwarf-4]
      ASM: [-D__MICROLIB, -DStack_Size=0x2000, -DHeap_Size=0x10000]
      Link: [--library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
    - for-compiler: GCC
      C: [-std=gnu11, --specs=nano.specs, -Wno-return-type, -Wno-unused-but-set-variable, -fdata-sections, -ffunction-sections, -fno-builtin, -fshort-enums, -funsigned-char, -mthumb, -gdwarf-4]
      ASM: [-D__STACK_SIZE=0x2000]
      Link: [-Xlinker, --gc-sections, --specs=nano.specs, '-Wl,-Map,$OutDir()$/$Project$.map']
  setups:
    - output:
        type: [elf, bin]
  linker:
    - for-compiler: AC6
      script: psa_ac6.sct
      define:
        - Stack_Size: "0x2000"
        - Heap_Size: "0x10000"
    - for-compiler: GCC
      script: ../GCC/gcc.ld
  groups:
    - group: PSA SignVerify ECC sample
      files:
        - file: ../main.c

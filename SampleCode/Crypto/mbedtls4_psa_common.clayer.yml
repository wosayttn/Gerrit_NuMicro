layer:
  description: Shared Mbed TLS 4.x PSA sources and M2354 BSP runtime for PSA sample projects
  define:
    - MBEDTLS_CONFIG_FILE: '"mbedtls_config.h"'
    - TF_PSA_CRYPTO_CONFIG_FILE: '"crypto_config.h"'
    - MBEDTLS_ALLOW_PRIVATE_ACCESS: ' '
    - MBEDTLS_ARCH_IS_ARM32
  add-path:
    - ../../Library/CMSIS/Include
    - ../../Library/Device/Nuvoton/M2354/Include
    - ../../Library/StdDriver/inc
    - ../../Library/CryptoAccelerator/src
    - ../../Library/CryptoAccelerator/configs/target
    - ../../Library/CryptoAccelerator/integration/firmware-overlay/tf-psa-crypto/include
    - ../../Library/CryptoAccelerator/integration/firmware-overlay/tf-psa-crypto/core
    - ../../ThirdParty/mbedtls/include
    - ../../ThirdParty/mbedtls/tf-psa-crypto/include
    - ../../ThirdParty/mbedtls/tf-psa-crypto/core
    - ../../ThirdParty/mbedtls/tf-psa-crypto/dispatch
    - ../../ThirdParty/mbedtls/tf-psa-crypto/drivers/builtin/include
    - ../../ThirdParty/mbedtls/tf-psa-crypto/drivers/builtin/src
    - ../../ThirdParty/mbedtls/tf-psa-crypto/extras
    - ../../ThirdParty/mbedtls/tf-psa-crypto/platform
    - ../../ThirdParty/mbedtls/tf-psa-crypto/utilities
  groups:
    - group: M2354 startup
      files:
        - file: ../../Library/Device/Nuvoton/M2354/Source/ARM/startup_m2354.s
          for-compiler: AC6
        - file: ../../Library/Device/Nuvoton/M2354/Source/GCC/startup_M2354.S
          for-compiler: GCC
        - file: ../../Library/Device/Nuvoton/M2354/Source/system_M2354.c
    - group: M2354 StdDriver
      files:
        - file: ../../Library/StdDriver/src/acmp.c
        - file: ../../Library/StdDriver/src/bpwm.c
        - file: ../../Library/StdDriver/src/can.c
        - file: ../../Library/StdDriver/src/clk.c
        - file: ../../Library/StdDriver/src/crc.c
        - file: ../../Library/StdDriver/src/crypto.c
        - file: ../../Library/StdDriver/src/dac.c
        - file: ../../Library/StdDriver/src/dpm.c
        - file: ../../Library/StdDriver/src/eadc.c
        - file: ../../Library/StdDriver/src/ebi.c
        - file: ../../Library/StdDriver/src/ecap.c
        - file: ../../Library/StdDriver/src/epwm.c
        - file: ../../Library/StdDriver/src/ewdt.c
        - file: ../../Library/StdDriver/src/ewwdt.c
        - file: ../../Library/StdDriver/src/fmc.c
        - file: ../../Library/StdDriver/src/fvc.c
        - file: ../../Library/StdDriver/src/gpio.c
        - file: ../../Library/StdDriver/src/i2c.c
        - file: ../../Library/StdDriver/src/i2s.c
        - file: ../../Library/StdDriver/src/keystore.c
        - file: ../../Library/StdDriver/src/lcd.c
        - file: ../../Library/StdDriver/src/pdma.c
        - file: ../../Library/StdDriver/src/qei.c
        - file: ../../Library/StdDriver/src/qspi.c
        - file: ../../Library/StdDriver/src/retarget.c
        - file: ../../Library/StdDriver/src/rng.c
        - file: ../../Library/StdDriver/src/rtc.c
        - file: ../../Library/StdDriver/src/sc.c
        - file: ../../Library/StdDriver/src/scuart.c
        - file: ../../Library/StdDriver/src/sdh.c
        - file: ../../Library/StdDriver/src/spi.c
        - file: ../../Library/StdDriver/src/sys.c
        - file: ../../Library/StdDriver/src/tamper.c
        - file: ../../Library/StdDriver/src/timer.c
        - file: ../../Library/StdDriver/src/timer_pwm.c
        - file: ../../Library/StdDriver/src/uart.c
        - file: ../../Library/StdDriver/src/usbd.c

project:
  packs:
    - pack: Nuvoton::NuMicroM55_DFP
  setups:
    - output:
        # bin, elf, hex, lib
        type: bin
    - setup: Options for HSUSBHUSBHRNDIS
      processor:
        fpu: dp
        mve: fp
        endian: little
        trustzone: "off"
      add-path:
        - ../../../../Library/CMSIS/Core/Include
        - ../../../../Library/Device/Nuvoton/M55M1/Include
        - ../../../../Library/StdDriver/inc
        - ../../../../Library/UsbHostLib/inc
        - ../../../../Library/UsbHostLib/src_core
        - ../../../../Library/UsbHostLib/src_rndis
        - ../../../../ThirdParty/lwIP/src/include
        - ../lwip_port
        - ../rndis_static_dashboard
        - ..
      define:
        - STDIN_ECHO: "0"
      misc:
        - for-compiler: AC6
          C:
            - -std=c11
          C-CPP:
            - -fno-rtti -funsigned-char -fshort-enums -fshort-wchar -ffunction-sections -fdata-sections -Wall
            - -D__MICROLIB
            - -Wconditional-uninitialized
            - -mno-unaligned-access
          CPP:
            - -xc++
            - -std=c++11
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib --map --load_addr_map_info --xref --callgraph --symbols
            - --info sizes --info totals --info unused --info veneers
            - --strict --summary_stderr --info summarysizes
        - for-compiler: GCC
          C:
            - -std=gnu11
          C-CPP:
            - -mthumb -masm-syntax-unified -fmessage-length=0 -fsigned-char -ffunction-sections -fdata-sections
            - -Wmaybe-uninitialized
            - -mno-unaligned-access
          Link:
            - -mthumb -fmessage-length=0 -fsigned-char --specs=nano.specs --specs=nosys.specs
            - -Wl,--gc-sections,-Map="$elf()$.map"
            - -Wl,--no-warn-rwx-segments
  linker:
    - script: ../../../../Library/Device/Nuvoton/M55M1/Source/ARM/M55M1.scf
      for-compiler: AC6
    - script: ../../../../Library/Device/Nuvoton/M55M1/Source/GCC/M55M1.ld
      for-compiler: GCC
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/M55M1/Source/system_M55M1.c

        - file: ../../../../Library/Device/Nuvoton/M55M1/Source/startup_M55M1.c
    - group: Driver
      files:
        - file: ../../../../Library/StdDriver/src/clk.c
        - file: ../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../Library/StdDriver/src/sys.c
        - file: ../../../../Library/StdDriver/src/uart.c
        - file: ../../../../Library/StdDriver/src/timer.c
    - group: User
      files:
        - file: ../main.c
    - group: UsbHostLib
      files:
        - file: ../../../../Library/UsbHostLib/src_core/ehci.c
        - file: ../../../../Library/UsbHostLib/src_core/ehci_iso.c
        - file: ../../../../Library/UsbHostLib/src_core/hub.c
        - file: ../../../../Library/UsbHostLib/src_core/mem_alloc.c
        - file: ../../../../Library/UsbHostLib/src_core/ohci_0.c
        - file: ../../../../Library/UsbHostLib/src_core/ohci_1.c
        - file: ../../../../Library/UsbHostLib/src_core/usb_core.c
    - group: UsbHostLib_RNDIS
      files:
        - file: ../../../../Library/UsbHostLib/src_rndis/rndis_driver.c
        - file: ../../../../Library/UsbHostLib/src_rndis/rndis_parser.c
        - file: ../../../../Library/UsbHostLib/src_rndis/rndis_ctrl.c
        - file: ../../../../Library/UsbHostLib/src_rndis/rndis_bulk.c
    - group: lwIP_NoSys_Core
      files:
        - file: ../../../../ThirdParty/lwIP/src/core/init.c
        - file: ../../../../ThirdParty/lwIP/src/core/def.c
        - file: ../../../../ThirdParty/lwIP/src/core/inet_chksum.c
        - file: ../../../../ThirdParty/lwIP/src/core/mem.c
        - file: ../../../../ThirdParty/lwIP/src/core/memp.c
        - file: ../../../../ThirdParty/lwIP/src/core/netif.c
        - file: ../../../../ThirdParty/lwIP/src/core/pbuf.c
        - file: ../../../../ThirdParty/lwIP/src/core/stats.c
        - file: ../../../../ThirdParty/lwIP/src/core/timeouts.c
        - file: ../../../../ThirdParty/lwIP/src/core/sys_lwip.c
        - file: ../../../../ThirdParty/lwIP/src/core/ip.c
        - file: ../../../../ThirdParty/lwIP/src/core/ipv4/ip4.c
        - file: ../../../../ThirdParty/lwIP/src/core/ipv4/ip4_addr.c
        - file: ../../../../ThirdParty/lwIP/src/core/ipv4/etharp.c
        - file: ../../../../ThirdParty/lwIP/src/netif/ethernet.c
        - file: ../../../../ThirdParty/lwIP/src/core/udp.c
        - file: ../../../../ThirdParty/lwIP/src/core/ipv4/dhcp.c
        - file: ../../../../ThirdParty/lwIP/src/core/tcp.c
        - file: ../../../../ThirdParty/lwIP/src/core/tcp_in.c
        - file: ../../../../ThirdParty/lwIP/src/core/tcp_out.c
    - group: Application
      files:
        - file: ../rndis_static_dashboard/rndis_dashboard_http.c
    - group: Network
      files:
        - file: ../rndis_static_dashboard/rndis_dashboard_netif.c
        - file: ../rndis_lwip_time.c
    - group: lwIP_Config
      files:
        - file: ../rndis_static_dashboard/lwipopts.h
name: CodeAnalysis

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  CodeAnalysis:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Code analysis
        shell: bash
        run: |
          CODE_ANALYSIS="D:/code-analysis/CPPCHECK_MISRA"

          set +e -x

          cd "$CODE_ANALYSIS"

          git pull

          pip install -r requirements.txt

          python code-analysis.py $GITHUB_WORKSPACE > /dev/null 2>&1
          ret=$?

          # Rename summary HTML (exists on both success and failure)
          MISRA_STATUS="$GITHUB_WORKSPACE/output/code-analysis-summary.html"
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          RENAMED_SUMMARY="$GITHUB_WORKSPACE/output/code-analysis-summary-${BRANCH_NAME}.html"
          if [[ -f "$MISRA_STATUS" ]]; then
            cp "$MISRA_STATUS" "$RENAMED_SUMMARY"
          fi

          if [ $ret -ne 0 ]; then

            STR_ATTACHMENT=""
            cd "$GITHUB_WORKSPACE"

            for file in "$GITHUB_WORKSPACE"/code-analysis-report*.zip; do
              if [[ -f "$file" ]]; then
                STR_ATTACHMENT="$file"
              fi
            done

            if [[ -f "$RENAMED_SUMMARY" ]]; then
              STR_ATTACHMENT="$STR_ATTACHMENT,$RENAMED_SUMMARY"
            fi

            echo $STR_ATTACHMENT >> "$GITHUB_WORKSPACE/attachments.txt"

          else

            echo "🎉 Code analysis script succeeded!"

          fi

          # Prepare GitHub Pages deployment (always run)
          cd "$GITHUB_WORKSPACE"
          PAGES_DIR="$GITHUB_WORKSPACE/pages"
          mkdir -p "$PAGES_DIR"

          # Fetch existing pages content from gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            for f in $(git ls-tree --name-only origin/gh-pages -- codeanalysis/ | grep -v '^codeanalysis/index\.html$'); do
              fname=$(basename "$f")
              git show "origin/gh-pages:$f" > "$PAGES_DIR/$fname" 2>/dev/null || true
            done
          fi

          # Copy new summary into pages (only exists on failure)
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          RENAMED_SUMMARY="$GITHUB_WORKSPACE/output/code-analysis-summary-${BRANCH_NAME}.html"
          if [[ -f "$RENAMED_SUMMARY" ]]; then
            cp "$RENAMED_SUMMARY" "$PAGES_DIR/"
          fi

          # Generate reports.json and index.html with Stage 1 / Stage 2 info
          python "$GITHUB_WORKSPACE/.github/scripts/generate_codeanalysis_index.py" "$PAGES_DIR"

          exit $ret

      - name: Persist pages to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          destination_dir: codeanalysis
          keep_files: true

      - name: Send mail
        if: failure()
        uses: ./.github/actions/send-mail
        with:
          mail-connection: ${{ secrets.MAIL_CONNECTION }}
          mail-to-ms10: ${{ secrets.MAIL_TO_MS10 }}
          mail-to-ms20: ${{ secrets.MAIL_TO_MS20 }}
          mail-to-ms40: ${{ secrets.MAIL_TO_MS40 }}
          mail-to-ms70: ${{ secrets.MAIL_TO_MS70 }}
          default-mail-to: ${{ secrets.MAIL_TO }}
          workflow-name: ${{ github.workflow }}
          ref-name: ${{ github.ref_name }}

